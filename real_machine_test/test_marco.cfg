    # 圆2: B=20 倾斜 (RTCP全五轴联动)
    RESPOND MSG="[RTCP CIRC] 圆2: B=20"
    G1 X15 Y0 F3000
    G1 B20 F400
    G4 P300
    _RTCP_SHOW_POS
    _PEN_DOWN
    G1 X29.49 Y3.88 F600
    G1 X27.99 Y7.50
