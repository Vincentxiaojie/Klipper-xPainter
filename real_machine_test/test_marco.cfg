# ============================================================
# 五轴 RTCP 测试宏集合
# 用法: 在 Klipper 控制台执行对应宏名即可，例如 TEST_RTCP
#
# 重要前提: 确保 printer.cfg 中 tool_length 正确实测
#   tool_length = B/C 旋转中心到笔尖的距离 (mm)
#   rotary_config: bc (B绕Y俯仰, C绕Z旋转)
# ============================================================

# ============================================================
# 辅助宏 — 安全归零 + 移动到参考位置
# ============================================================
[gcode_macro _RTCP_HOME_AND_ZERO]
description: 归零后移动到 X100 Y100 Z50 并设 G92 零点
gcode:
    G28 X Y Z B C
    G90
    G1 X100 Y100 Z50 F3000
    G4 P500
    G92 X0 Y0 Z0 B0 C0
    G4 P500
    M114
    RESPOND PREFIX="RTCP: " MSG="归零完成, 笔尖在 (0,0,0), 等待测试..."

# ============================================================
# 辅助宏 — 输出当前位置 (M114 + GET_POSITION)
# ============================================================
[gcode_macro _RTCP_SHOW_POS]
description: 输出当前位置用于诊断
gcode:
    M114
    GET_POSITION

# ============================================================
# TEST_RTCP — 定点旋转基础验证
# 笔尖固定在一处，B/C 轴做离散角度变化
# 预期: 笔尖始终不动，XYZ 电机随 B/C 联动补偿
# ============================================================
[gcode_macro TEST_RTCP]
description: RTCP 定点旋转 — 笔尖不动, B/C 轴单独变化
gcode:
    RESPOND PREFIX="RTCP: " MSG="=== 定点旋转测试开始 ==="
    RESPOND PREFIX="RTCP: " MSG="请在笔尖处放参照物，观察笔尖是否移动"
    _RTCP_HOME_AND_ZERO
    G4 P1000

    # === 阶段 1: 纯 B 轴俯仰 ===
    RESPOND PREFIX="RTCP: " MSG="--- 阶段1: B轴俯仰 0->15->25->0 ---"
    G1 B15 F400
    G4 P500
    _RTCP_SHOW_POS

    G1 B25 F400
    G4 P500
    _RTCP_SHOW_POS

    G1 B0 F400
    G4 P1000
    _RTCP_SHOW_POS

    # === 阶段 2: B倾斜下C旋转 ===
    RESPOND PREFIX="RTCP: " MSG="--- 阶段2: B=15时C旋转 +-20 ---"
    G1 B15 F400
    G4 P500
    G1 C20 F400
    G4 P500
    _RTCP_SHOW_POS

    G1 C-20 F400
    G4 P500
    _RTCP_SHOW_POS

    G1 C0 B0 F400
    G4 P1000

    # === 阶段 3: 大角度组合 ===
    RESPOND PREFIX="RTCP: " MSG="--- 阶段3: B=25 C=+-20 ---"
    G1 B25 C20 F400
    G4 P500
    _RTCP_SHOW_POS

    G1 C-20 F400
    G4 P500
    _RTCP_SHOW_POS

    # 回正
    G1 B0 C0 F400
    _RTCP_SHOW_POS
    RESPOND PREFIX="RTCP: " MSG="=== 定点旋转测试完成 ==="
    RESPOND PREFIX="RTCP: " MSG="检查 M114 输出: XYZ 应始终为 0.000"

# ============================================================
# TEST_RTCP_SWEEP — B 轴连续扫描
# B 从 0 渐变到 30 再回到 0，观察笔尖是否始终保持不动
# ============================================================
[gcode_macro TEST_RTCP_SWEEP]
description: B轴连续扫描 — 平滑俯仰观察 RTCP 补偿
gcode:
    RESPOND PREFIX="RTCP: " MSG="=== B轴连续扫描测试 ==="
    _RTCP_HOME_AND_ZERO
    G4 P1000

    # 缓慢俯仰: 用小步进模拟连续运动
    RESPOND PREFIX="RTCP: " MSG="B: 0 -> +30 (缓慢俯仰)"
    G1 B5 F300
    G4 P200
    _RTCP_SHOW_POS
    G1 B10 F300
    G4 P200
    _RTCP_SHOW_POS
    G1 B15 F300
    G4 P200
    _RTCP_SHOW_POS
    G1 B20 F300
    G4 P200
    _RTCP_SHOW_POS
    G1 B25 F300
    G4 P200
    _RTCP_SHOW_POS
    G1 B30 F300
    G4 P500
    _RTCP_SHOW_POS

    RESPOND PREFIX="RTCP: " MSG="B: +30 -> -15 (反向俯仰)"
    G1 B25 F300
    G4 P200
    G1 B15 F300
    G4 P200
    G1 B5 F300
    G4 P200
    G1 B0 F300
    G4 P200
    G1 B-15 F300
    G4 P500
    _RTCP_SHOW_POS

    # 回正
    G1 B0 F400
    _RTCP_SHOW_POS
    RESPOND PREFIX="RTCP: " MSG="=== B轴扫描完成 — 检查XYZ始终为 0.000 ==="

# ============================================================
# TEST_RTCP_CONE — 锥形运动
# B 固定倾角, C 连续旋转 → 工具绕笔尖做锥形运动
# 这是展示 RTCP 最直观的测试
# ============================================================
[gcode_macro TEST_RTCP_CONE]
description: 锥形运动 — C轴旋转一圈, 工具绕笔尖画锥
gcode:
    RESPOND PREFIX="RTCP: " MSG="=== 锥形运动测试 ==="
    RESPOND PREFIX="RTCP: " MSG="笔尖不动, 工具绕垂直轴做锥形旋转"
    _RTCP_HOME_AND_ZERO
    G4 P1000

    # 先倾斜 B 到 15 度
    RESPOND PREFIX="RTCP: " MSG="倾角 B=15, 开始 C 旋转..."
    G1 B15 F400
    G4 P500

    # C 旋转一圈 (分 8 步, 每步 45 度)
    G1 C45 F400
    G4 P300
    _RTCP_SHOW_POS

    G1 C90 F400
    G4 P300
    _RTCP_SHOW_POS

    G1 C135 F400
    G4 P300
    _RTCP_SHOW_POS

    G1 C180 F400
    G4 P300
    _RTCP_SHOW_POS

    G1 C225 F400
    G4 P300
    _RTCP_SHOW_POS

    G1 C270 F400
    G4 P300
    _RTCP_SHOW_POS

    G1 C315 F400
    G4 P300
    _RTCP_SHOW_POS

    G1 C360 F400
    G4 P300
    _RTCP_SHOW_POS

    # 回正
    G1 B0 C0 F400
    _RTCP_SHOW_POS
    RESPOND PREFIX="RTCP: " MSG="=== 锥形运动完成 ==="

# ============================================================
# TEST_RTCP_LARGE — 大角度验证
# 使用 B=45 度 (机器极限) 验证 RTCP 补偿范围
# ============================================================
[gcode_macro TEST_RTCP_LARGE]
description: 大角度 RTCP — 验证 B=45 极限下的补偿精度
gcode:
    RESPOND PREFIX="RTCP: " MSG="=== 大角度 RTCP 测试 ==="
    RESPOND PREFIX="RTCP: " MSG="注意: B=45 是机器极限, 请确保安全!"
    _RTCP_HOME_AND_ZERO
    G4 P1000

    # 缓慢走向大角度
    G1 B15 F300
    G4 P300
    _RTCP_SHOW_POS

    G1 B25 F300
    G4 P300
    _RTCP_SHOW_POS

    G1 B35 F300
    G4 P300
    _RTCP_SHOW_POS

    G1 B45 F300
    G4 P500
    _RTCP_SHOW_POS

    RESPOND PREFIX="RTCP: " MSG="B=45 时 C 旋转 +-20"
    G1 C20 F400
    G4 P500
    _RTCP_SHOW_POS

    G1 C-20 F400
    G4 P500
    _RTCP_SHOW_POS

    # 回正
    G1 B0 C0 F400
    _RTCP_SHOW_POS
    RESPOND PREFIX="RTCP: " MSG="=== 大角度测试完成 ==="

# ============================================================
# TEST_RTCP_TIP_TRACE — 笔尖画点验证
# 在纸面上放一支笔，B/C 变化后观察笔尖是否移动
# 实用验证方法: 在笔尖正下方做标记
# ============================================================
[gcode_macro TEST_RTCP_TIP_TRACE]
description: 笔尖画点 — B/C 变化后能否回到原位
gcode:
    RESPOND PREFIX="RTCP: " MSG="=== 笔尖回位测试 ==="
    RESPOND PREFIX="RTCP: " MSG="请在笔尖下放纸, 标记初始位置"
    _RTCP_HOME_AND_ZERO
    G4 P2000

    # 在纸上点一下 (降 Z 后抬起)
    G1 Z-2 F200
    G4 P500
    G1 Z0 F200
    G4 P1000
    RESPOND PREFIX="RTCP: " MSG="初始点已标记"

    # 做一系列 RTCP 运动
    G1 B15 C30 F400
    G4 P500
    G1 B25 C-30 F400
    G4 P500
    G1 B10 C180 F400
    G4 P500
    G1 B20 C90 F400
    G4 P500
    G1 B0 C0 F400
    G4 P1000

    # 再次点一下, 应与初始点重合
    RESPOND PREFIX="RTCP: " MSG="再次点纸 — 应与初始标记重合"
    G1 Z-2 F200
    G4 P500
    G1 Z0 F200
    _RTCP_SHOW_POS
    RESPOND PREFIX="RTCP: " MSG="=== 回位测试完成 ==="

# ============================================================
# TEST_XYZBC — 五轴联动演示 (从 printer.cfg 移入)
# ============================================================
[gcode_macro TEST_XYZBC]
description: 五轴联动演示 — XYZBC 协调运动
gcode:
    RESPOND PREFIX="5AXIS: " MSG="五轴联动测试开始"
    _RTCP_HOME_AND_ZERO
    RESPOND PREFIX="5AXIS: " MSG="参考零点已设 — 观察笔尖位置"
    G4 P500

    # Demo 1: B轴俯仰 (XYZB四轴联动)
    RESPOND PREFIX="5AXIS: " MSG="Demo1: B轴 +-15 俯仰 — XYZB联动"
    G1 B15 F400
    G4 P500
    G1 B-15 F400
    G4 P500
    G1 B0 F400
    G4 P1000

    # Demo 2: C轴在B=0时旋转 (仅C动)
    RESPOND PREFIX="5AXIS: " MSG="Demo2: B=0 时 C轴 +-30 — 仅C动"
    G1 C30 F400
    G4 P500
    G1 C-30 F400
    G4 P500
    G1 C0 F400
    G4 P1000

    # Demo 3: B倾斜后C旋转 (XYC三轴联动)
    RESPOND PREFIX="5AXIS: " MSG="Demo3: B=15倾斜下 C轴 +-30 — XYC联动"
    G1 B15 F400
    G4 P500
    G1 C30 F400
    G4 P500
    G1 C-30 F400
    G4 P500
    G1 C0 B0 F400
    G4 P1000

    # Demo 4: BC组合对角运动
    RESPOND PREFIX="5AXIS: " MSG="Demo4: BC组合对角 — 五轴协同"
    G1 B15 C15 F400
    G4 P500
    G1 B-15 C-15 F400
    G4 P500
    G1 B0 C0 F400
    G4 P1000

    RESPOND PREFIX="5AXIS: " MSG="五轴联动测试完成"
