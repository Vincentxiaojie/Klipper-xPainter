# ============================================================
# 五轴 RTCP 渐进式画线测试宏 (Level 1-6)
# ============================================================
# 用法: 在 Klipper 控制台依次执行 TEST_RTCP_1AXIS → 2AXIS → FULL
#
# 每次测试前需准备:
#   1. A4 纸放在工作台上
#   2. 笔装好，调好高度使 G92 Z=0 时笔尖刚好离纸面 5mm
#   3. (按需调整 _RTCP_HOME_AND_ZERO 中的 Z5 和 _PEN_DOWN 的 Z-5)
#
# RTCP 参数: tool_length=80, rotary_config=bc
# 轴范围: X 0-240, Y 0-200, Z 0-150, B -45~+45, C -45~+45
# ============================================================

# ============================================================
# 辅助宏 — 安全归零 + 定位参考点
# 归零后移到 X100 Y100, 笔尖降到 Z=5 (离桌面 5mm), 设 G92 零点
# ============================================================
[gcode_macro _RTCP_HOME_AND_ZERO]
description: 全轴归零后定位到参考点, 笔尖在桌面以上 5mm
gcode:
    G28 X Y Z B C
    G90
    G1 X100 Y100 Z50 F3000
    G1 X100 Y100 Z5 F600
    G4 P500
    G92 X0 Y0 Z0 B0 C0
    G4 P300
    M114

# ============================================================
# 辅助宏 — 输出位置诊断
# ============================================================
[gcode_macro _RTCP_SHOW_POS]
description: 输出 M114 + GET_POSITION 用于诊断
gcode:
    M114
    GET_POSITION

# ============================================================
# 辅助宏 — 降笔和抬笔 (相对 Z 移动)
# 笔触不到纸则增大 _PEN_DOWN 的 Z 值
# ============================================================
[gcode_macro _PEN_DOWN]
description: 降笔接触纸面 (G91 Z-5)
gcode:
    G91
    G1 Z-5 F200
    G90

[gcode_macro _PEN_UP]
description: 抬笔离开纸面 (G91 Z5)
gcode:
    G91
    G1 Z5 F200
    G90

# ============================================================
# Level 1: TEST_RTCP_1AXIS — 纯 XYZ 基线 (无 RTCP)
# 画 X 方向线 + Y 方向线 + 中心点
# 目的: 确认基本画线功能正常, 建立对比基线
# ============================================================
[gcode_macro TEST_RTCP_1AXIS]
description: Level 1 — XYZ 基线画线 (无旋转轴)
gcode:
    RESPOND MSG="[RTCP L1] === 纯XYZ基线画线 ==="
    _RTCP_HOME_AND_ZERO
    G4 P500

    # 画 X 方向线 (从原点向右 50mm)
    RESPOND MSG="[RTCP L1] 画X线: (0,0)->(50,0)"
    _PEN_DOWN
    G1 X50 F600
    _PEN_UP

    # 画 Y 方向线 (从原点向前 50mm)
    RESPOND MSG="[RTCP L1] 画Y线: (0,0)->(0,50)"
    G1 X0 F3000
    _PEN_DOWN
    G1 Y50 F600
    _PEN_UP

    # 中心点标记
    RESPOND MSG="[RTCP L1] 打中心点"
    G1 Y0 F3000
    _PEN_DOWN
    G4 P500
    _PEN_UP

    _RTCP_SHOW_POS
    RESPOND MSG="[RTCP L1] === 基线完成: 十字线 + 中心点 ==="

# ============================================================
# Level 2: TEST_RTCP_2AXIS — XZ + B 轴俯仰 (2轴联动)
# B=0/15/25/-15 各画一条 X 方向线
# RTCP 补偿 XZ 使四条线重合
# ============================================================
[gcode_macro TEST_RTCP_2AXIS]
description: Level 2 — B轴俯仰画线 (XZB联动)
gcode:
    RESPOND MSG="[RTCP L2] === XZ + B轴俯仰 画线对比 ==="
    _RTCP_HOME_AND_ZERO
    G4 P500

    # 线1: B=0 基线
    RESPOND MSG="[RTCP L2] 线1: B=0"
    _PEN_DOWN
    G1 X50 F600
    _PEN_UP
    G1 X0 F3000

    # 线2: B=15 倾斜
    RESPOND MSG="[RTCP L2] 线2: B=15"
    G1 B15 F400
    G4 P300
    _RTCP_SHOW_POS
    _PEN_DOWN
    G1 X50 F600
    _PEN_UP
    G1 X0 F3000

    # 线3: B=25 大倾角
    RESPOND MSG="[RTCP L2] 线3: B=25"
    G1 B25 F400
    G4 P300
    _RTCP_SHOW_POS
    _PEN_DOWN
    G1 X50 F600
    _PEN_UP
    G1 X0 F3000

    # 线4: B=-15 反向俯仰
    RESPOND MSG="[RTCP L2] 线4: B=-15"
    G1 B-15 F400
    G4 P300
    _RTCP_SHOW_POS
    _PEN_DOWN
    G1 X50 F600
    _PEN_UP

    G1 B0 X0 F600
    _RTCP_SHOW_POS
    RESPOND MSG="[RTCP L2] === 4条线应重合, 不重合则 tool_length 需校准 ==="

# ============================================================
# Level 3: TEST_RTCP_3AXIS — XY + C 轴旋转 (3轴联动)
# C=0/30/-30 及 B=15+C=30 各画一条 X 方向线
# 预期: 线宽随C变化, 但位置不变
# ============================================================
[gcode_macro TEST_RTCP_3AXIS]
description: Level 3 — C轴旋转画线对比 (XYC联动)
gcode:
    RESPOND MSG="[RTCP L3] === XY + C轴旋转 画线对比 ==="
    _RTCP_HOME_AND_ZERO
    G4 P500

    # 线1: C=0 基线
    RESPOND MSG="[RTCP L3] 线1: C=0"
    _PEN_DOWN
    G1 X50 F600
    _PEN_UP
    G1 X0 F3000

    # 线2: C=30 旋转
    RESPOND MSG="[RTCP L3] 线2: C=30"
    G1 C30 F400
    G4 P300
    _RTCP_SHOW_POS
    _PEN_DOWN
    G1 X50 F600
    _PEN_UP
    G1 X0 F3000

    # 线3: C=-30 反向旋转
    RESPOND MSG="[RTCP L3] 线3: C=-30"
    G1 C-30 F400
    G4 P300
    _RTCP_SHOW_POS
    _PEN_DOWN
    G1 X50 F600
    _PEN_UP
    G1 X0 F3000

    # 线4: B=15 倾斜 + C=30 旋转
    RESPOND MSG="[RTCP L3] 线4: B=15+C=30"
    G1 B15 C30 F400
    G4 P300
    _RTCP_SHOW_POS
    _PEN_DOWN
    G1 X50 F600
    _PEN_UP

    G1 B0 C0 X0 F600
    _RTCP_SHOW_POS
    RESPOND MSG="[RTCP L3] === 4条线应重合, 线宽随C角变化 ==="

# ============================================================
# Level 4: TEST_RTCP_4AXIS — XYZB 四轴联动画方框
# B=0/B=20/B=-15 各画一个 30x30mm 正方形
# RTCP 补偿使三个方框重合
# ============================================================
[gcode_macro TEST_RTCP_4AXIS]
description: Level 4 — 倾斜画方框对比 (XYZB联动)
gcode:
    RESPOND MSG="[RTCP L4] === XYZB 四轴联动画方框 ==="
    _RTCP_HOME_AND_ZERO
    G4 P500

    # 方框1: B=0 基线 (30x30mm)
    RESPOND MSG="[RTCP L4] 框1: B=0"
    _PEN_DOWN
    G1 X30 F600
    G1 Y30 F600
    G1 X0 F600
    G1 Y0 F600
    _PEN_UP
    G4 P500

    # 方框2: B=20 倾斜
    RESPOND MSG="[RTCP L4] 框2: B=20"
    G1 B20 F400
    G4 P300
    _RTCP_SHOW_POS
    _PEN_DOWN
    G1 X30 F600
    G1 Y30 F600
    G1 X0 F600
    G1 Y0 F600
    _PEN_UP
    G4 P500

    # 方框3: B=-15 反向倾斜
    RESPOND MSG="[RTCP L4] 框3: B=-15"
    G1 B-15 F400
    G4 P300
    _RTCP_SHOW_POS
    _PEN_DOWN
    G1 X30 F600
    G1 Y30 F600
    G1 X0 F600
    G1 Y0 F600
    _PEN_UP

    G1 B0 F600
    _RTCP_SHOW_POS
    RESPOND MSG="[RTCP L4] === 3个方框应重合, 偏移->tool_length不准 ==="

# ============================================================
