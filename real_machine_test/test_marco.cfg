# ============================================================
# Level 6: TEST_RTCP_FULL — XYZBC 五轴多点打点验收
# 5个参考点: B=0 打一轮, B=15/C=20 再打一轮
# 两组点完全重合 = RTCP 验收通过
# ============================================================
[gcode_macro TEST_RTCP_FULL]
description: Level 6 — 最终验收: 五点多姿态打点 (全五轴)
gcode:
    RESPOND MSG="[RTCP FULL] === 五轴多点打点验收 ==="
    _RTCP_HOME_AND_ZERO
    G4 P1000
    _RTCP_SHOW_POS

    # 第1轮: B=0 C=0 打 5 个参考点
    RESPOND MSG="[RTCP FULL] 第1轮: B=0 C=0 (基线)"

    # 点1: 中心 (0,0)
    RESPOND MSG="[RTCP FULL]   点1: 中心"
    _PEN_DOWN
    G4 P500
    _PEN_UP

    # 点2: 右 (25, 0)
    RESPOND MSG="[RTCP FULL]   点2: 右"
    G1 X25 F3000
    _PEN_DOWN
    G4 P500
    _PEN_UP

    # 点3: 前 (25, 25)
    RESPOND MSG="[RTCP FULL]   点3: 前"
    G1 Y25 F3000
    _PEN_DOWN
    G4 P500
    _PEN_UP

    # 点4: 左 (0, 25)
    RESPOND MSG="[RTCP FULL]   点4: 左"
    G1 X0 F3000
    _PEN_DOWN
    G4 P500
    _PEN_UP

    # 点5: 回中心 (0, 0)
    RESPOND MSG="[RTCP FULL]   点5: 回中心"
    G1 Y0 F3000
    _PEN_DOWN
    G4 P500
    _PEN_UP

    G4 P1000

    # 第2轮: B=15 C=20 重访相同的 5 个点
    RESPOND MSG="[RTCP FULL] 第2轮: B=15 C=20 (RTCP)"
    G1 B15 C20 F400
    G4 P500
    _RTCP_SHOW_POS

    # 点1: 中心
    RESPOND MSG="[RTCP FULL]   点1: 中心 RTCP"
    G1 X0 Y0 F3000
    _PEN_DOWN
    G4 P500
    _PEN_UP

    # 点2: 右
    RESPOND MSG="[RTCP FULL]   点2: 右 RTCP"
    G1 X25 Y0 F3000
    _PEN_DOWN
    G4 P500
    _PEN_UP

    # 点3: 前
    RESPOND MSG="[RTCP FULL]   点3: 前 RTCP"
    G1 Y25 F3000
    _PEN_DOWN
    G4 P500
    _PEN_UP

    # 点4: 左
    RESPOND MSG="[RTCP FULL]   点4: 左 RTCP"
    G1 X0 F3000
    _PEN_DOWN
    G4 P500
    _PEN_UP

    # 点5: 回中心
    RESPOND MSG="[RTCP FULL]   点5: 回中心 RTCP"
    G1 Y0 F3000
    _PEN_DOWN
    G4 P500
    _PEN_UP

    G1 B0 C0 F600
    _RTCP_SHOW_POS
    RESPOND MSG="[RTCP FULL] === 两轮点应完全重合 — RTCP验收完成 ==="

