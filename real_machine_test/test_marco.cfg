    G1 X27.99 Y-7.50
    G1 X29.49 Y-3.88
    G1 X30.00 Y0.00
    _PEN_UP
    G4 P500

    # 圆2: B=20 倾斜 (RTCP全五轴联动)
    RESPOND MSG="[RTCP L5] 圆2: B=20"
    G1 X15 Y0 F3000
    G1 B20 F400
    G4 P300
    _RTCP_SHOW_POS
    _PEN_DOWN
    G1 X29.49 Y3.88 F600
    G1 X27.99 Y7.50
    G1 X25.61 Y10.61
    G1 X22.50 Y12.99
    G1 X18.88 Y14.49
    G1 X15.00 Y15.00
    G1 X11.12 Y14.49
    G1 X7.50 Y12.99
    G1 X4.39 Y10.61
    G1 X2.01 Y7.50
    G1 X0.51 Y3.88
    G1 X0.00 Y0.00
    G1 X0.51 Y-3.88
    G1 X2.01 Y-7.50
    G1 X4.39 Y-10.61
    G1 X7.50 Y-12.99
    G1 X11.12 Y-14.49
