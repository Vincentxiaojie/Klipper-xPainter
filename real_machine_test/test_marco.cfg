    _RTCP_HOME_AND_ZERO
    G4 P500

    # 移到圆心 (半径 15mm, 起点在圆心右 15mm)
    G1 X15 Y0 F3000

    # 圆1: B=0 基线
    RESPOND MSG="[RTCP L5] 圆1: B=0"
    _PEN_DOWN
    G1 X29.49 Y3.88 F600
