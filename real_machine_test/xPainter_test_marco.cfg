# ============================================================
# 五轴 RTCP 渐进式画线测试宏 (Level 1-6)
# ============================================================
# 用法: 在 Klipper 控制台依次执行:
#   TEST_RTCP_BASELINE → TEST_RTCP_B → C_ROTATE → SQUARE → CIRCLE → FULL
#
# 每次测试前需准备:
#   1. A4 纸放在工作台上
#   2. 笔装好，执行 XP_Z_CAL → XP_Z_TOUCH 标定纸面 Z0
#   3. (按需调整 printer.cfg 中 PEN_DOWN 的 Z 值)
#
# 画笔方向约束:
#   B>0 笔尖在右 → X递减 (从右往左拖着走)
#   B=0 垂直 → 任意方向
#   B<0 笔尖在左 → X递增 (从左往右)
#
# RTCP 参数: tool_length=48.8, rotary_config=bc
# 轴范围: X 0-200, Y 0-200, Z 0-250, B -45~+45, C -45~+45
# ============================================================

# ============================================================
# 辅助宏 — 安全归零 + 定位参考点
# 归零后移到 X100 Y100, 笔尖降到 Z=5 (离桌面 5mm), 设 G92 零点
# ============================================================
[gcode_macro _RTCP_HOME_AND_ZERO]
description: 全轴归零后定位到参考点, 笔尖在桌面以上 7mm
gcode:
    G28 X Y Z B C
    G90
    G1 X100 Y100 Z50 F3000
    G1 X100 Y100 Z5 F600
    G4 P500
    G92 X0 Y0 Z0 B0 C0
    G4 P300
    M114

# ============================================================
# 辅助宏 — 输出位置诊断
# ============================================================
[gcode_macro _RTCP_SHOW_POS]
description: 输出 M114 + GET_POSITION 用于诊断 (带分隔线)
gcode:
    RESPOND MSG="========== DIAG START =========="
    M114
    GET_POSITION
    RESPOND MSG="========== DIAG END =========="

# ============================================================
# Level 1: TEST_RTCP_BASELINE — 纯 XYZ 基线 (无 RTCP)
# 画 X 方向线 + Y 方向线 + 中心点
# 目的: 确认基本画线功能正常, 建立对比基线
# ============================================================
[gcode_macro TEST_RTCP_BASELINE]
description: Level 1 — XYZ 基线画十字线 (无旋转轴)
gcode:
    RESPOND MSG="[RTCP BASE] === 纯XYZ基线画十字线 ==="
    _RTCP_HOME_AND_ZERO
    G4 P500
    _RTCP_SHOW_POS

    # 画 +X 方向线 (从原点向右 50mm)
    RESPOND MSG="[RTCP BASE] 画+X线: (0,0)->(50,0)"
    PEN_DOWN
    G1 X50 F600
    PEN_UP

    # 画 -X 方向线 (从原点向左 50mm)
    RESPOND MSG="[RTCP BASE] 画-X线: (0,0)->(-50,0)"
    G1 X0 F3000
    PEN_DOWN
    G1 X-50 F600
    PEN_UP

    # 画 +Y 方向线 (从原点向前 50mm)
    RESPOND MSG="[RTCP BASE] 画+Y线: (0,0)->(0,50)"
    G1 X0 F3000
    PEN_DOWN
    G1 Y50 F600
    PEN_UP

    # 画 -Y 方向线 (从原点向后 50mm)
    RESPOND MSG="[RTCP BASE] 画-Y线: (0,0)->(0,-50)"
    G1 Y0 F3000
    PEN_DOWN
    G1 Y-50 F600
    PEN_UP

    # 中心点标记
    RESPOND MSG="[RTCP BASE] 打中心点"
    G1 Y0 F3000
    PEN_DOWN
    G4 P500
    PEN_UP

    _RTCP_SHOW_POS
    RESPOND MSG="[RTCP BASE] === 基线完成: 十字线(+-X +-Y) + 中心点 ==="

# ============================================================
# Level 2: TEST_RTCP_B — B轴RTCP综合测试 (两阶段)
# Phase 1: B=0/15/25/-15 各画X方向线, 起始点应对齐 X=0
# Phase 2: 纯B变化打点 (XY不动), 4点应完全重合
# ============================================================
[gcode_macro TEST_RTCP_B]
description: Level 2 — B轴RTCP综合测试 (画线+打点)
gcode:
    RESPOND MSG="[RTCP B] === B轴RTCP综合测试 ==="
    _RTCP_HOME_AND_ZERO
    G4 P500
    _RTCP_SHOW_POS

    # === Phase 1: B 俯仰画线对比 ===
    # B>0 (笔尖在右): X递减 (从右往左拖着走)
    # B=0: 任意方向 (基线)
    # B<0 (笔尖在左): X递增 (从左往右)

    # 线1: B=0 基线, Y=0 → 从左往右 X递增
    RESPOND MSG="[RTCP B] Phase1 线1: B=0 Y=0"
    G1 X0 Y0 F3000
    PEN_DOWN
    G4 P300
    PEN_UP
    PEN_DOWN
    G1 X50 F600
    PEN_UP

    # 线2: B=15 (笔尖在右), Y=10 → 从右往左 X递减
    RESPOND MSG="[RTCP B] Phase1 线2: B=15 Y=10"
    G1 B15 F400
    G4 P300
    G1 X50 Y10 F3000
    _RTCP_SHOW_POS
    PEN_DOWN
    G4 P300
    PEN_UP
    PEN_DOWN
    G1 X0 F600
    PEN_UP

    # 线3: B=25 (笔尖在右), Y=20 → 从右往左 X递减
    RESPOND MSG="[RTCP B] Phase1 线3: B=25 Y=20"
    G1 B25 F400
    G4 P300
    G1 X50 Y20 F3000
    _RTCP_SHOW_POS
    PEN_DOWN
    G4 P300
    PEN_UP
    PEN_DOWN
    G1 X0 F600
    PEN_UP

    # 线4: B=-15 (笔尖在左), Y=30 → 从左往右 X递增
    RESPOND MSG="[RTCP B] Phase1 线4: B=-15 Y=30"
    G1 B-15 F400
    G4 P300
    G1 X0 Y30 F3000
    _RTCP_SHOW_POS
    PEN_DOWN
    G4 P300
    PEN_UP
    PEN_DOWN
    G1 X50 F600
    PEN_UP

    G1 B0 F400
    RESPOND MSG="[RTCP B] Phase1完成: 4条线起始点应排成一列(X=0)"

    # === Phase 2: 纯 B 变化打点 (XY 不动) ===
    RESPOND MSG="[RTCP B] Phase2: 纯B变化打点 (XY不动)"
    G1 X-25 Y0 F3000
    G4 P500
    _RTCP_SHOW_POS

    # 点1: B=0
    RESPOND MSG="[RTCP B] Phase2 点1: B=0"
    PEN_DOWN
    G4 P500
    PEN_UP

    # 点2: B=15 (纯B变化, XY不动)
    RESPOND MSG="[RTCP B] Phase2 点2: B=15"
    G1 B15 F400
    G4 P500
    _RTCP_SHOW_POS
    PEN_DOWN
    G4 P500
    PEN_UP

    # 点3: B=-15
    RESPOND MSG="[RTCP B] Phase2 点3: B=-15"
    G1 B-15 F400
    G4 P500
    _RTCP_SHOW_POS
    PEN_DOWN
    G4 P500
    PEN_UP

    # 点4: B=0 (应与点1重合)
    RESPOND MSG="[RTCP B] Phase2 点4: B=0"
    G1 B0 F400
    G4 P500
    _RTCP_SHOW_POS
    PEN_DOWN
    G4 P500
    PEN_UP

    _RTCP_SHOW_POS
    RESPOND MSG="[RTCP B] === 完成 ==="
    RESPOND MSG="[RTCP B] Phase1: 4条线起始点应对齐X=0 — 不对齐则tool_length需校准"
    RESPOND MSG="[RTCP B] Phase2: 4个点应完全重合 — 不重合则RTCP插值有偏差"

# ============================================================
# Level 3: TEST_RTCP_C_ROTATE — XY + C 轴旋转 (3轴联动)
# C=0/30/-30 及 B=15+C=30 各画一条 X 方向线
# 预期: 线宽随C变化, 但位置不变
# ============================================================
[gcode_macro TEST_RTCP_C_ROTATE]
description: Level 3 — C轴旋转画线对比 (XYC联动)
gcode:
    RESPOND MSG="[RTCP C] === XY + C轴旋转 画线对比 ==="
    _RTCP_HOME_AND_ZERO
    G4 P500
    _RTCP_SHOW_POS

    # 线1: C=0 基线
    RESPOND MSG="[RTCP C] 线1: C=0"
    PEN_DOWN
    G1 X50 F600
    PEN_UP
    G1 X0 F3000

    # 线2: C=30 旋转
    RESPOND MSG="[RTCP C] 线2: C=30"
    G1 C30 F400
    G4 P300
    _RTCP_SHOW_POS
    PEN_DOWN
    G1 X50 F600
    PEN_UP
    G1 X0 F3000

    # 线3: C=-30 反向旋转
    RESPOND MSG="[RTCP C] 线3: C=-30"
    G1 C-30 F400
    G4 P300
    _RTCP_SHOW_POS
    PEN_DOWN
    G1 X50 F600
    PEN_UP
    G1 X0 F3000

    # 线4: B=15 倾斜 + C=30 旋转
    RESPOND MSG="[RTCP C] 线4: B=15+C=30"
    G1 B15 C30 F400
    G4 P300
    _RTCP_SHOW_POS
    PEN_DOWN
    G1 X50 F600
    PEN_UP

    G1 B0 C0 X0 F600
    _RTCP_SHOW_POS
    RESPOND MSG="[RTCP C] === 4条线应重合, 线宽随C角变化 ==="

# ============================================================
# Level 3.5: TEST_RTCP_C_ECCENTRIC — C轴偏心RTCP验证
# Phase 1: 纯C变化打点 (C=0/30/-30/0, B=0, XY不动)
#          笔头偏心时RTCP应补偿XY轨道运动, 4点应重合
# Phase 2: C=0/30/-30 各画X方向线, 3线起始点应对齐X=0
# ============================================================
[gcode_macro TEST_RTCP_C_ECCENTRIC]
description: Level 3.5 — C轴偏心RTCP验证 (偏心笔头)
gcode:
    RESPOND MSG="[RTCP C-E] === C轴偏心RTCP验证 ==="
    _RTCP_HOME_AND_ZERO
    G4 P500
    _RTCP_SHOW_POS

    # === Phase 1: 纯C变化打点 (XY不动) ===
    RESPOND MSG="[RTCP C-E] Phase1: 纯C变化打点 (XY不动)"
    # 点1: C=0 基准
    PEN_DOWN
    G4 P500
    PEN_UP

    # 点2: C=30 (纯C变化, XY不动, B=0)
    G1 C30 F400
    G4 P500
    _RTCP_SHOW_POS
    PEN_DOWN
    G4 P500
    PEN_UP

    # 点3: C=-30
    G1 C-30 F400
    G4 P500
    _RTCP_SHOW_POS
    PEN_DOWN
    G4 P500
    PEN_UP

    # 点4: C=0 (应与点1重合)
    G1 C0 F400
    G4 P500
    _RTCP_SHOW_POS
    PEN_DOWN
    G4 P500
    PEN_UP

    RESPOND MSG="[RTCP C-E] Phase1完成: 4点应重合 — 不重合则pivot_y需校准"

    # === Phase 2: C=0/30/-30 各画X方向线 ===
    RESPOND MSG="[RTCP C-E] Phase2: 不同C角画X线对比"
    G1 X0 F3000
    G4 P500

    # 线1: C=0 基线
    RESPOND MSG="[RTCP C-E] Phase2 线1: C=0"
    PEN_DOWN
    G1 X50 F600
    PEN_UP
    G1 X0 F3000

    # 线2: C=30
    RESPOND MSG="[RTCP C-E] Phase2 线2: C=30"
    G1 C30 F400
    G4 P300
    _RTCP_SHOW_POS
    PEN_DOWN
    G1 X50 F600
    PEN_UP
    G1 X0 F3000

    # 线3: C=-30
    RESPOND MSG="[RTCP C-E] Phase2 线3: C=-30"
    G1 C-30 F400
    G4 P300
    _RTCP_SHOW_POS
    PEN_DOWN
    G1 X50 F600
    PEN_UP

    G1 C0 X0 F600
    _RTCP_SHOW_POS
    RESPOND MSG="[RTCP C-E] === 完成 ==="
    RESPOND MSG="[RTCP C-E] Phase1: 4点应重合 — 不重合则pivot_y需校准"
    RESPOND MSG="[RTCP C-E] Phase2: 3线起始点应对齐X=0 — 不对齐则pivot_y不准"

# ============================================================
# Level 4: TEST_RTCP_SQUARE — XYZB 四轴联动画方框
# B=0/B=20/B=-15 各画一个 30x30mm 正方形
# RTCP 补偿使三个方框重合
# ============================================================
[gcode_macro TEST_RTCP_SQUARE]
description: Level 4 — 倾斜画方框对比 (XYZB联动)
gcode:
    RESPOND MSG="[RTCP SQ] === XYZB 四轴联动画方框 ==="
    _RTCP_HOME_AND_ZERO
    G4 P500
    _RTCP_SHOW_POS

    # 方框1: B=0 基线 (30x30mm)
    RESPOND MSG="[RTCP SQ] 框1: B=0"
    PEN_DOWN
    G1 X30 F600
    G1 Y30 F600
    G1 X0 F600
    G1 Y0 F600
    PEN_UP
    G4 P500

    # 方框2: B=20 倾斜 (笔尖在右 → 水平段优先后退方向)
    RESPOND MSG="[RTCP SQ] 框2: B=20"
    G1 B20 F400
    G4 P300
    G1 X30 Y0 F3000   # 从右上角开始
    _RTCP_SHOW_POS
    PEN_DOWN
    G1 Y30 F600       # ↑ 垂直 (Y方向不受约束)
    G1 X0 F600        # ← 后退 (X递减, 拖着走, 安全)
    G1 Y0 F600        # ↓ 垂直
    G1 X30 F600       # → 前进 (X递增, 推着走, 仅此一条边)
    PEN_UP
    G4 P500

    # 方框3: B=-15 反向倾斜 (笔尖在左 → X递增安全)
    RESPOND MSG="[RTCP SQ] 框3: B=-15"
    G1 B-15 F400
    G4 P300
    _RTCP_SHOW_POS
    PEN_DOWN
    G1 X30 F600
    G1 Y30 F600
    G1 X0 F600
    G1 Y0 F600
    PEN_UP

    G1 B0 F600
    _RTCP_SHOW_POS
    RESPOND MSG="[RTCP SQ] === 3个方框应重合, 偏移->tool_length不准 ==="

