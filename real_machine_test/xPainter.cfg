# ============================================================
# xPainter 校准宏
# ============================================================
# CALIBRATE_Z_OFFSET    — Z 工作零点标定（触纸后一键保存）
# CALIBRATE_TOOL_LENGTH — X 偏差打点法标定 tool_length（两步）
# TOOL_CAL_TOUCH        — 触纸确认 + 打点（标定流程第二步）
# TOOL_CAL_REPORT       — 输入 X 偏差计算推荐 tool_length
# CALIBRATE_C_OFFSET    — C 轴偏心标定启动（触纸后执行 C_CAL_TOUCH）
# C_CAL_TOUCH           — 自动打 C=0 和 C=30 两个点
# C_CAL_REPORT          — 输入 X 偏差计算推荐 pivot_y
# _RESTORE_Z_OFFSET     — 启动时自动恢复 Z 零点（G28 自动调用）
# ============================================================

# ============================================================
# Z 工作零点 — 一键标定
# 用法: 归零 → 手动下探触纸 → 执行 CALIBRATE_Z_OFFSET
# ============================================================
[gcode_macro CALIBRATE_Z_OFFSET]
description: 标定 Z 工作零点 — 触纸后执行，持久化保存
gcode:
    {% set current_z = printer.gcode_move.position.z %}
    SAVE_VARIABLE VARIABLE=z_ref VALUE={current_z}
    G92 Z0
    RESPOND MSG="[CAL] Z零点已保存, z_ref={current_z}mm, 纸面=Z0"

# ============================================================
# Z 工作零点 — 启动自动恢复（由 G28 末尾调用）
# ============================================================
[gcode_macro _RESTORE_Z_OFFSET]
description: 启动时恢复 Z 工作零点
gcode:
    {% if printer.save_variables.variables.z_ref is defined %}
        {% set z_ref = printer.save_variables.variables.z_ref|float %}
        {% set z_endstop = printer.configfile.config["stepper_z"]["position_endstop"]|float %}
        {% set tool_length = printer.configfile.config["printer"]["tool_length"]|float %}
        G92 Z{z_endstop - tool_length - z_ref}
        RESPOND MSG="[CAL] Z零点已恢复, z_ref={z_ref}, 纸面=Z0"
    {% else %}
        RESPOND MSG="[CAL] Z零点未标定，跳过恢复。请先执行 CALIBRATE_Z_OFFSET"
    {% endif %}

# ============================================================
# Tool Length 标定 — X 偏差打点法（两步交互）
#
# 原理: 如果 tool_length 不准，B 轴倾斜时 RTCP 会错误补偿 X 轴，
#       导致 B=0 和 B=θ 两个点不重合。测量 X 间距反算 tool_length。
#
# 用法:
#   1. 执行 CALIBRATE_TOOL_LENGTH（归零、提示触纸）
#   2. 手动下探触纸后执行 TOOL_CAL_TOUCH（自动打两个点）
#   3. 用尺子测量两点 X 间距 + 方向（点2在点1左边还是右边）
#   4. 执行 TOOL_CAL_REPORT X_ERR=<间距>（右边为正，左边为负）
#
# 公式: L_correct = L_current - X_error / sin(B)
# ============================================================
[gcode_macro CALIBRATE_TOOL_LENGTH]
description: 启动 tool_length 标定 — 归零后提示触纸
gcode:
    G28
    {% set mid_x = printer.configfile.config["stepper_x"]["position_max"]|float / 2.0 %}
    {% set mid_y = printer.configfile.config["stepper_y"]["position_max"]|float / 2.0 %}
    G1 X{mid_x} Y{mid_y} Z30 F3000
    G1 B0 F400
    RESPOND MSG="[CAL] === Tool Length 标定 (X偏差法) ==="
    RESPOND MSG="[CAL] 请手动下探触纸后执行 TOOL_CAL_TOUCH"

[gcode_macro TOOL_CAL_TOUCH]
description: 触纸确认 + 自动打 B=0 和 B=15 两个点
gcode:
    {% set current_z = printer.gcode_move.position.z %}
    SAVE_VARIABLE VARIABLE=z_ref VALUE={current_z}
    G92 Z0
    RESPOND MSG="[CAL] Z零点已更新, z_ref={current_z}, 纸面=Z0"

    RESPOND MSG="[CAL] 打点1: B=0 (参考点)"
    _PEN_DOWN
    _PEN_UP

    G91
    G1 Z5 F200
    G90
    G1 B30 F400
    RESPOND MSG="[CAL] 打点2: B=30"
    G1 Z0 F200
    _PEN_DOWN
    _PEN_UP

    G91
    G1 Z10 F200
    G90
    G1 B0 F400
    G1 Z30 F200

    RESPOND MSG="[CAL] 两个点已打好"
    RESPOND MSG="[CAL] 观察: 点2在点1左边=负, 右边=正"
    RESPOND MSG="[CAL] 测量X间距后: TOOL_CAL_REPORT X_ERR=<mm>"
    RESPOND MSG="[CAL] 示例: TOOL_CAL_REPORT X_ERR=30 (右边为正)"
    RESPOND MSG="[CAL] 示例: TOOL_CAL_REPORT X_ERR=-30 (左边为负)"

[gcode_macro TOOL_CAL_REPORT]
description: 输入 X 偏差计算推荐 tool_length
gcode:
    {% if params.X_ERR is not defined %}
        RESPOND MSG="[CAL] 用法: TOOL_CAL_REPORT X_ERR=<间距mm> B_ANGLE=<角度>"
        RESPOND MSG="[CAL] X_ERR正=点2在点1右边, 负=左边"
        RESPOND MSG="[CAL] 示例: TOOL_CAL_REPORT X_ERR=-30 B_ANGLE=30"
    {% else %}
        {% set x_err = params.X_ERR|float %}
        {% set b_angle = params.B_ANGLE|default(30)|float %}
        {% set tl_current = printer.configfile.config["printer"]["tool_length"]|float %}
        {% set sin_b = 0.5 %}
        {% if b_angle == 15.0 %}
            {% set sin_b = 0.258819045 %}
        {% elif b_angle == 20.0 %}
            {% set sin_b = 0.342020143 %}
        {% endif %}
        {% set delta_l = x_err / sin_b %}
        {% set tl_correct = tl_current + delta_l %}
        RESPOND MSG="[CAL] =============================="
        RESPOND MSG="[CAL] X偏差={x_err}mm  B={b_angle}度"
        RESPOND MSG="[CAL] delta_L={delta_l}mm"
        RESPOND MSG="[CAL] 当前 tool_length={tl_current}"
        RESPOND MSG="[CAL] 推荐 tool_length: {tl_correct}"
        RESPOND MSG="[CAL] =============================="
        RESPOND MSG="[CAL] 修改 printer.cfg 的 tool_length 后重启"
        RESPOND MSG="[CAL] 重启后重新执行一次 CALIBRATE_Z_OFFSET"
    {% endif %}

# ============================================================
# C 轴偏心标定 — X 偏差打点法（两步交互）
#
# 原理: 笔头不在C轴旋转中心时（偏心安装），如果 pivot_y 不准，
#       C 轴旋转会错误补偿 XY，导致 C=0 和 C=θ 两个点不重合。
#       测量 X 间距反算偏心量。
#
# 用法:
#   1. 执行 CALIBRATE_C_OFFSET（归零、B=0、移到中心、提示触纸）
#   2. 手动下探触纸后执行 C_CAL_TOUCH（自动打 C=0 和 C=30 两个点）
#   3. 用尺子测量两点 X 间距 + 方向（点2在点1左边还是右边）
#   4. 执行 C_CAL_REPORT DX=<间距>（右边为正，左边为负）
#
# 公式: offset = -dx / sin(C_angle)
#       例如 C=30°: offset = -dx / 0.5 = -2*dx
#       若 dx=-5mm (点2在点1左边): offset = -(-5)/0.5 = 10mm
#       即 pivot_y = 10mm（笔尖在旋转中心 Y+ 方向 10mm）
# ============================================================
[gcode_macro CALIBRATE_C_OFFSET]
description: 启动 C 轴偏心标定 — 归零后提示触纸
gcode:
    G28
    {% set mid_x = printer.configfile.config["stepper_x"]["position_max"]|float / 2.0 %}
    {% set mid_y = printer.configfile.config["stepper_y"]["position_max"]|float / 2.0 %}
    G1 X{mid_x} Y{mid_y} Z30 F3000
    G1 B0 C0 F400
    RESPOND MSG="[CAL] === C轴偏心标定 (X偏差法) ==="
    RESPOND MSG="[CAL] B=0确保笔垂直, C=0为基准角度"
    RESPOND MSG="[CAL] 请手动下探触纸后执行 C_CAL_TOUCH"

[gcode_macro C_CAL_TOUCH]
description: 触纸确认 + 自动打 C=0 和 C=30 两个点
gcode:
    {% set current_z = printer.gcode_move.position.z %}
    SAVE_VARIABLE VARIABLE=z_ref VALUE={current_z}
    G92 Z0
    RESPOND MSG="[CAL] Z零点已更新, z_ref={current_z}, 纸面=Z0"

    RESPOND MSG="[CAL] 打点1: C=0 (参考点, 笔头在Y+偏移方向)"
    _PEN_DOWN
    _PEN_UP

    G91
    G1 Z5 F200
    G90
    G1 C30 F400
    RESPOND MSG="[CAL] 打点2: C=30 (笔头逆时针转30度)"
    G1 Z0 F200
    _PEN_DOWN
    _PEN_UP

    G91
    G1 Z10 F200
    G90
    G1 C0 F400
    G1 Z30 F200

    RESPOND MSG="[CAL] 两个点已打好"
    RESPOND MSG="[CAL] 观察: 点2在点1左边=负(dx), 右边=正(dx)"
    RESPOND MSG="[CAL] 测量X间距后: C_CAL_REPORT DX=<mm>"
    RESPOND MSG="[CAL] 示例: C_CAL_REPORT DX=-5 (左边为负)"

[gcode_macro C_CAL_REPORT]
description: 输入 X 偏差计算推荐 pivot_y
gcode:
    {% if params.DX is not defined %}
        RESPOND MSG="[CAL] 用法: C_CAL_REPORT DX=<X间距mm> C_ANGLE=<角度>"
        RESPOND MSG="[CAL] DX正=点2在点1右边, 负=左边"
        RESPOND MSG="[CAL] 示例: C_CAL_REPORT DX=-5 C_ANGLE=30"
    {% else %}
        {% set dx = params.DX|float %}
        {% set c_angle = params.C_ANGLE|default(30)|float %}
        {% set sin_c = 0.5 %}
        {% if c_angle == 15.0 %}
            {% set sin_c = 0.258819045 %}
        {% elif c_angle == 20.0 %}
            {% set sin_c = 0.342020143 %}
        {% endif %}
        {% set offset = -dx / sin_c %}
        RESPOND MSG="[CAL] =============================="
        RESPOND MSG="[CAL] X偏差={dx}mm  C={c_angle}度"
        RESPOND MSG="[CAL] 推算偏心量 offset={offset}mm"
        RESPOND MSG="[CAL] (公式: offset = -dx / sin(C) = -{dx}/{sin_c})"
        RESPOND MSG="[CAL] "
        RESPOND MSG="[CAL] 解释: 笔头在C=0时Y方向偏移"
        RESPOND MSG="[CAL] 推荐 pivot_y = {offset}"
        RESPOND MSG="[CAL] (如果笔头同时有X偏移, 额外拆分到pivot_x)"
        RESPOND MSG="[CAL] =============================="
        RESPOND MSG="[CAL] 修改 printer.cfg 的 pivot_y 后重启"
        RESPOND MSG="[CAL] 重启后重新执行一次 CALIBRATE_Z_OFFSET"
    {% endif %}
