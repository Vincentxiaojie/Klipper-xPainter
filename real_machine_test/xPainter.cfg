# ============================================================
# xPainter 校准宏
# ============================================================
# CALIBRATE_Z_OFFSET   — Z 工作零点标定（触纸后一键保存）
# CALIBRATE_TOOL_LENGTH — B 轴倾斜法标定 tool_length
# _RESTORE_Z_OFFSET    — 启动时自动恢复 Z 零点（G28 自动调用）
# ============================================================

# ============================================================
# Z 工作零点 — 一键标定
# 用法: 归零 → 手动下探触纸 → 执行 CALIBRATE_Z_OFFSET
# ============================================================
[gcode_macro CALIBRATE_Z_OFFSET]
description: 标定 Z 工作零点 — 触纸后执行，持久化保存
gcode:
    {% set current_z = printer.gcode_move.position.z %}
    SAVE_VARIABLE VARIABLE=z_ref VALUE={current_z}
    G92 Z0
    RESPOND MSG="[CAL] Z零点已保存 (纸面=Z0, 原始z_ref={current_z}mm)"

# ============================================================
# Z 工作零点 — 启动自动恢复（由 G28 末尾调用）
# ============================================================
[gcode_macro _RESTORE_Z_OFFSET]
description: 启动时恢复 Z 工作零点
gcode:
    {% if printer.save_variables.variables.z_ref is defined %}
        {% set z_ref = printer.save_variables.variables.z_ref|float %}
        {% set z_endstop = printer.configfile.config["stepper_z"]["position_endstop"]|float %}
        {% set tool_length = printer.configfile.config["printer"]["tool_length"]|float %}
        G92 Z{z_endstop - tool_length - z_ref}
        RESPOND MSG="[CAL] Z零点已恢复 (纸面=Z0)"
    {% else %}
        RESPOND MSG="[CAL] Z零点未标定，跳过恢复。请先执行 CALIBRATE_Z_OFFSET"
    {% endif %}

# ============================================================
# Tool Length 标定 — B 轴倾斜法
# 用法:
#   1. 执行 CALIBRATE_TOOL_LENGTH 开始
#   2. 在 B=0 触纸后执行 TOOL_CAL_NEXT
#   3. 在 B=30 触纸后执行 TOOL_CAL_NEXT (自动计算)
# ============================================================
[gcode_macro CALIBRATE_TOOL_LENGTH]
description: 启动 tool_length 标定流程 (B轴倾斜法)
gcode:
    G28
    SAVE_VARIABLE VARIABLE=tl_cal_state VALUE='"b0"'
    {% set mid_x = printer.configfile.config["stepper_x"]["position_max"]|float / 2.0 %}
    {% set mid_y = printer.configfile.config["stepper_y"]["position_max"]|float / 2.0 %}
    G1 X{mid_x} Y{mid_y} Z30 F3000
    G1 B0 F400
    RESPOND MSG="[CAL] === Tool Length 标定 ==="
    RESPOND MSG="[CAL] B=0 就绪，请手动下探触纸后执行 TOOL_CAL_NEXT"

[gcode_macro TOOL_CAL_NEXT]
description: 记录当前触纸位置并推进标定流程
gcode:
    {% set state = printer.save_variables.variables.tl_cal_state|default("b0") %}
    {% set current_z = printer.gcode_move.position.z %}

    {% if state == "b0" %}
        SAVE_VARIABLE VARIABLE=tl_cal_z0 VALUE={current_z}
        SAVE_VARIABLE VARIABLE=tl_cal_state VALUE='"b30"'
        G1 B30 F400
        RESPOND MSG="[CAL] B=0 触纸 Z={current_z} 已记录"
        RESPOND MSG="[CAL] B→30°, RTCP已补偿, 请再次下探触纸后执行 TOOL_CAL_NEXT"

    {% elif state == "b30" %}
        {% set z0 = printer.save_variables.variables.tl_cal_z0|float %}
        {% set z30 = current_z %}
        {% set cos30 = 0.8660254 %}
        {% set delta_z = z30 - z0 %}
        {% set delta_l = delta_z / (cos30 - 1.0) %}
        {% set tl_current = printer.configfile.config["printer"]["tool_length"]|float %}
        {% set tl_correct = tl_current - delta_l %}

        SAVE_VARIABLE VARIABLE=tl_cal_state VALUE='"done"'
        RESPOND MSG="[CAL] B=30 触纸 Z={z30} 已记录"
        RESPOND MSG="[CAL] =============================="
        RESPOND MSG="[CAL] Z(B=0)={z0}  Z(B=30)={z30}"
        RESPOND MSG="[CAL] ΔZ={delta_z}mm  ΔL={delta_l}mm"
        RESPOND MSG="[CAL] 当前 tool_length={tl_current}"
        RESPOND MSG="[CAL] ★ 推荐 tool_length: {tl_correct} ★"
        RESPOND MSG="[CAL] =============================="
        RESPOND MSG="[CAL] 请手动修改 printer.cfg 中 [printer] tool_length 后重启"

    {% else %}
        RESPOND MSG="[CAL] 标定流程未启动，请先执行 CALIBRATE_TOOL_LENGTH"
    {% endif %}
