# ============================================================
# 油画 CNC — 五轴 RTCP (BC 结构) 配置文件
# ============================================================
# 使用前请根据实际硬件修改所有标注 <<< 的参数。
#
# BC 结构说明:
#   B 轴 — 绕 Y 轴旋转（笔的俯仰倾斜角）
#   C 轴 — 绕 Z 轴旋转（笔的方向旋转，控制长方形笔头线宽）
#   tool_length — B 轴旋转中心到笔尖的距离 (mm)
# ============================================================

# ============================================================
# MCU 主板
# ============================================================
[mcu mmu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_2100150007504D5930313920-if00
restart_method: command
[temperature_sensor mcu_mmu]
sensor_type: temperature_mcu
sensor_mcu: mmu
min_temp: 0
max_temp: 100


[mcu]
# Change serial: "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0" to your spesific one. SSH into the rasp pi with klipper on and type "ls /dev/serial/by-id/*"
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

# ============================================================
# 打印机基本参数
# ============================================================
[printer]
kinematics: cartesian_rtcp
max_velocity: 50
max_accel: 500
# Z 轴单独限速（可选，确保垂直方向安全）
max_z_velocity: 25
max_z_accel: 100

# === RTCP 参数 ===
# <<< 修改: B 轴旋转中心到笔尖的距离 (mm)，需实测 >>>
tool_length: 124.8#120#173
# 旋转轴配置: bc = B绕Y俯仰 + C绕Z旋转
rotary_config: bc

# ============================================================
# X 轴（左右） # Orginal Stepper E on the board
# ============================================================
[stepper_x]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
position_endstop: 0
position_min: 0
position_max: 250
endstop_pin: ^PA4
homing_speed: 40
homing_positive_dir: false 

homing_retract_dist: 5
second_homing_speed: 5

# ============================================================
# Y 轴（前后）
# ============================================================
[stepper_y1]
# Orginal Stepper X on the board
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5

[stepper_y]
# Orginal Stepper Y on the board
step_pin: PB8
dir_pin: !PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 200
position_min: 0
position_max: 200
homing_speed: 40
homing_positive_dir:true 

# ============================================================
# Z 轴（上下）
# ============================================================
[stepper_z]
# Orginal Stepper Z on the board
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: ^PA7
position_endstop:250
position_min: 0
position_max: 250
homing_speed: 20
homing_positive_dir: true
homing_retract_dist: 3
second_homing_speed: 3

# ============================================================
# B 轴（绕 Y 俯仰 — 笔的倾斜角度）
# ============================================================

#多色主板的M2,配STOP16
[stepper_b]
step_pin: mmu:PD2
dir_pin: mmu:PB13
enable_pin: !mmu:PD1
microsteps: 16
rotation_distance: 360
endstop_pin: ^mmu:PC15
position_endstop: 0
position_min: -45
position_max: 45
homing_speed: 50
homing_positive_dir: false
homing_retract_dist: 10
second_homing_speed: 10
homing_endstop_offset: 5


[tmc2209 stepper_b]
uart_pin: mmu:PC7
run_current: 0.5
hold_current: 0.5

# ============================================================
# C 轴（绕 Z 旋转 — 笔的方向）
# ============================================================
[stepper_c]
#多色主板的M1,配STOP8
step_pin: mmu:PB15
dir_pin: mmu:PB14
enable_pin: !mmu:PA8
microsteps: 16
rotation_distance: 360
endstop_pin: ^mmu:PD3
position_endstop: 0
position_min: -45
position_max: 45
homing_speed: 50
homing_positive_dir: false

homing_retract_dist: 10
second_homing_speed: 10
homing_endstop_offset: 5

[tmc2209 stepper_c]
uart_pin: mmu:PA10
run_current: 0.5
hold_current: 0.5

[temperature_fan electronic_fans]
pin: PA0
max_power: 0.7
shutdown_speed: 0.0
control: watermark
max_delta: 5
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100
target_temp: 20

[temperature_sensor Klipper_host]
sensor_type: temperature_host
min_temp: 10
max_temp: 100 


# ============================================================
# 虚拟 SD 卡（上传 G-code 文件打印）
# ============================================================

[virtual_sdcard]
path: /home/alpha/Klipper-xPainter-data/gcodes

# ============================================================
# 暂停/恢复
# ============================================================
[pause_resume]

# ============================================================
# 消息反馈
# ============================================================
[respond]
[display_status] 
# ============================================================
# 手动控制（SET_KINEMATIC_POSITION 等）
# ============================================================
[force_move]
enable_force_move: True

    
[gcode_macro CANCEL_PRINT]
gcode:
    RESPOND PREFIX="CANCEL_PRINT: " MSG="Print cancelled by user "
    PAUSE
    
# ============================================================
# 安全宏
# ============================================================

# --- 紧急停止后恢复 ---
[gcode_macro M999]
gcode:
    FIRMWARE_RESTART

# --- 电机解锁 ---
[gcode_macro M18]
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_b ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_c ENABLE=0

# --- 电机锁定 ---
[gcode_macro M17]
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_b ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_c ENABLE=1

# # --- 所有轴归零 ---
[gcode_macro G28]
rename_existing: G28.618  # 把原廠帶有硬件剎車的歸位命令改名為 G28.618 保存
gcode:
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set mid_x = max_x / 2.0 %}
    {% set mid_y = max_y / 2.0 %}
    
    # 1. 優先歸位 Z 軸（調用原廠命令，撞到限位立刻停車！）
    G28.618 Z
    
    # 2. 安全下降到 Z50 留出空間
    G1 Z50 F1200
    
    # 3. 歸位 B 軸 和 C 轴
    G28.618 B C
    
    # 4. 最後歸位 X 軸 和 Y 軸
    G28.618 X 
    G1 X{mid_x} F3000           # X 軸立刻移動到中點位置
    
    G28.618 Y
    G1 Y{mid_y} F3000 
    # 5. 移動到最終的停留點（請把下方的 X110 Y110 改為你熱床的中心點）
    G1 X{mid_x} Y{mid_y} Z30 F3000



# --- 抬笔到安全高度 ---
[gcode_macro LIFT]
gcode:
    G91
    G1 Z30 F600
    G90

# ============================================================
# 用户自定义区（可添加更多宏）
# ============================================================

# --- 归零后移动到工作起始位置 ---
[gcode_macro START_POSITION]
gcode:
    G90
    # <<< 修改为你的工作起始位置 >>>
    G1 X150 Y150 Z100 B0 C0 F3000

# --- 引用外部测试宏 ---
[include test_marco.cfg]
