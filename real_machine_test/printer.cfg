# ============================================================
# 油画 CNC — 五轴 RTCP (BC 结构) 配置文件
# ============================================================
# 使用前请根据实际硬件修改所有标注 <<< 的参数。
#
# BC 结构说明:
#   B 轴 — 绕 Y 轴旋转（笔的俯仰倾斜角）
#   C 轴 — 绕 Z 轴旋转（笔的方向旋转，控制长方形笔头线宽）
#   tool_length — B 轴旋转中心到笔尖的距离 (mm)
# ============================================================

# ============================================================
# MCU 主板
# ============================================================
[mcu mmu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_2100150007504D5930313920-if00
restart_method: command
[temperature_sensor mcu_mmu]
sensor_type: temperature_mcu
sensor_mcu: mmu
min_temp: 0
max_temp: 100


[mcu]
# Change serial: "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0" to your spesific one. SSH into the rasp pi with klipper on and type "ls /dev/serial/by-id/*"
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
restart_method: command

# ============================================================
# 打印机基本参数
# ============================================================
[printer]
kinematics: cartesian_rtcp
max_velocity: 50
max_accel: 500
# Z 轴单独限速（可选，确保垂直方向安全）
max_z_velocity: 25
max_z_accel: 100

# === RTCP 参数 ===
# <<< 修改: B 轴旋转中心到笔尖的距离 (mm)，需实测 >>>
tool_length: 80
# 旋转轴配置: bc = B绕Y俯仰 + C绕Z旋转
rotary_config: bc

# ============================================================
# X 轴（左右） # Orginal Stepper E on the board
# ============================================================
[stepper_x]
step_pin: PB4
dir_pin: PB3
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
position_endstop: 0
position_min: 0
position_max: 240
endstop_pin: ^PA4
homing_speed: 40
homing_positive_dir: false 

homing_retract_dist: 5
second_homing_speed: 5

# ============================================================
# Y 轴（前后）
# ============================================================
[stepper_y1]
# Orginal Stepper X on the board
step_pin: PC2
dir_pin: PB9
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA5

[stepper_y]
# Orginal Stepper Y on the board
step_pin: PB8
dir_pin: !PB7
enable_pin: !PC3
microsteps: 16
rotation_distance: 40
endstop_pin: ^PA6
position_endstop: 200
position_min: 0
position_max: 200
homing_speed: 40
homing_positive_dir:true 

# ============================================================
# Z 轴（上下）
# ============================================================
[stepper_z]
# Orginal Stepper Z on the board
step_pin: PB6
dir_pin: !PB5
enable_pin: !PC3
microsteps: 16
rotation_distance: 8
endstop_pin: ^PA7
position_endstop:150
position_min: 0
position_max: 150
homing_speed: 20
homing_positive_dir: true
homing_retract_dist: 3
second_homing_speed: 3

# ============================================================
# B 轴（绕 Y 俯仰 — 笔的倾斜角度）
# ============================================================

#多色主板的M2,配STOP16
[stepper_b]
step_pin: mmu:PD2
dir_pin: mmu:PB13
enable_pin: !mmu:PD1
microsteps: 16
rotation_distance: 360
endstop_pin: ^mmu:PC15
position_endstop: 0
position_min: -45
position_max: 45
homing_speed: 50
homing_positive_dir: false
homing_retract_dist: 10
second_homing_speed: 5
homing_endstop_offset: 5


[tmc2209 stepper_b]
uart_pin: mmu:PC7
run_current: 0.5
hold_current: 0.5

# ============================================================
# C 轴（绕 Z 旋转 — 笔的方向）
# ============================================================
[stepper_c]
#多色主板的M1,配STOP8
step_pin: mmu:PB15
dir_pin: mmu:PB14
enable_pin: !mmu:PA8
microsteps: 16
rotation_distance: 360
endstop_pin: ^mmu:PD3
position_endstop: 0
position_min: -45
position_max: 45
homing_speed: 50
homing_positive_dir: false

homing_retract_dist: 10
second_homing_speed: 5
homing_endstop_offset: 5

[tmc2209 stepper_c]
uart_pin: mmu:PA10
run_current: 0.5
hold_current: 0.5

[temperature_fan electronic_fans]
pin: PA0
max_power: 0.7
shutdown_speed: 0.0
control: watermark
max_delta: 5
sensor_type: temperature_mcu
min_temp: 0
max_temp: 100
target_temp: 20

[temperature_sensor Klipper_host]
sensor_type: temperature_host
min_temp: 10
max_temp: 100 


# ============================================================
# 虚拟 SD 卡（上传 G-code 文件打印）
# ============================================================

[virtual_sdcard]
path: /home/alpha/Klipper-xPainter-data/gcodes

# ============================================================
# 暂停/恢复
# ============================================================
[pause_resume]

# ============================================================
# 消息反馈
# ============================================================
[respond]
[display_status] 
# ============================================================
# 手动控制（SET_KINEMATIC_POSITION 等）
# ============================================================
[force_move]
enable_force_move: True

[gcode_macro CANCEL_PRINT]
gcode:
    RESPOND PREFIX="CANCEL_PRINT: " MSG="Print cancelled by user"
    PAUSE
    
# ============================================================
# 安全宏
# ============================================================

# --- 紧急停止后恢复 ---
[gcode_macro M999]
gcode:
    FIRMWARE_RESTART

# --- 电机解锁 ---
[gcode_macro M18]
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_b ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_c ENABLE=0

# --- 电机锁定 ---
[gcode_macro M17]
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_b ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_c ENABLE=1

# --- 所有轴归零 ---
[gcode_macro HOME_ALL]
gcode:
    G28 X Y Z B C

# --- 抬笔到安全高度 ---
[gcode_macro LIFT]
gcode:
    G91
    G1 Z30 F600
    G90

# ============================================================
# 用户自定义区（可添加更多宏）
# ============================================================

# --- 归零后移动到工作起始位置 ---
[gcode_macro START_POSITION]
gcode:
    G90
    # <<< 修改为你的工作起始位置 >>>
    G1 X150 Y150 Z100 B0 C0 F3000

# --- 五轴 RTCP 联调演示 ---
[gcode_macro TEST_XYZBC]
gcode:
    RESPOND PREFIX="5AXIS: " MSG="五轴联动测试开始"
    G28 X Y Z B C
    G90
    # 移到工作位置并设参考零点
    G1 X100 Y100 Z50 F3000
    G92 X0 Y0 Z0 B0 C0
    RESPOND PREFIX="5AXIS: " MSG="参考零点已设 — 观察笔尖位置"
    G4 P500

    # === Demo 1: B轴俯仰 (XYZB四轴联动) ===
    # 笔尖不动，但XYZ电机会随B轴联动补偿
    RESPOND PREFIX="5AXIS: " MSG="Demo1: B轴 +-15 俯仰 — XYZB联动"
    G1 B15 F400
    G4 P500
    G1 B-15 F400
    G4 P500
    G1 B0 F400
    G4 P1000

    # === Demo 2: C轴在B=0时旋转 (仅C动) ===
    # B=0 时 sin(B)=0，RTCP不补偿XY，纯C旋转
    RESPOND PREFIX="5AXIS: " MSG="Demo2: B=0 时 C轴 +-30 — 仅C动"
    G1 C30 F400
    G4 P500
    G1 C-30 F400
    G4 P500
    G1 C0 F400
    G4 P1000

    # === Demo 3: B倾斜后C旋转 (XYC三轴联动) ===
    # B!=0 时 sin(B)!=0，C旋转会带动XY联动补偿
    RESPOND PREFIX="5AXIS: " MSG="Demo3: B=15倾斜下 C轴 +-30 — XYC联动"
    G1 B15 F400
    G4 P500
    G1 C30 F400
    G4 P500
    G1 C-30 F400
    G4 P500
    G1 C0 B0 F400
    G4 P1000

    # === Demo 4: BC组合对角运动 ===
    # B和C同时变化，五轴协同
    RESPOND PREFIX="5AXIS: " MSG="Demo4: BC组合对角 — 五轴协同"
    G1 B15 C15 F400
    G4 P500
    G1 B-15 C-15 F400
    G4 P500
    G1 B0 C0 F400
    G4 P1000

    RESPOND PREFIX="5AXIS: " MSG="五轴联动测试完成"

# --- RTCP 定点旋转演示 ---
# 笔尖固定在一个点，旋转轴围绕该点做锥形运动 —— RTCP 的核心能力
[gcode_macro TEST_RTCP]
gcode:
    RESPOND PREFIX="RTCP: " MSG="定点旋转测试 — 请在笔尖处放参照物"
    G28 X Y Z B C
    G90
    G1 X100 Y100 Z50 F3000
    G92 X0 Y0 Z0 B0 C0
    G4 P1000

    # 笔尖应在 (0,0,0)，以下所有动作笔尖应保持不动
    RESPOND PREFIX="RTCP: " MSG="B=15 笔尖不动"
    G1 B15 F400
    G4 P500

    RESPOND PREFIX="RTCP: " MSG="B=15 C=20 笔尖不动"
    G1 C20 F400
    G4 P500

    RESPOND PREFIX="RTCP: " MSG="B=15 C=-20 笔尖不动"
    G1 C-20 F400
    G4 P500

    RESPOND PREFIX="RTCP: " MSG="B=25 C=0 笔尖不动"
    G1 C0 B25 F400
    G4 P500

    RESPOND PREFIX="RTCP: " MSG="B=25 C=20 笔尖不动"
    G1 C20 F400
    G4 P500

    RESPOND PREFIX="RTCP: " MSG="B=25 C=-20 笔尖不动"
    G1 C-20 F400
    G4 P500

    RESPOND PREFIX="RTCP: " MSG="B=10 C=30 笔尖不动"
    G1 B10 C30 F400
    G4 P500

    RESPOND PREFIX="RTCP: " MSG="B=10 C=-30 笔尖不动"
    G1 C-30 F400
    G4 P500

    # 回正
    G1 B0 C0 F400
    RESPOND PREFIX="RTCP: " MSG="定点旋转测试完成 — 笔尖应始终未动"
