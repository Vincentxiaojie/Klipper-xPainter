# ============================================================
# 油画 CNC — 五轴 RTCP (BC 结构) 配置文件
# ============================================================
# 使用前请根据实际硬件修改所有标注 <<< 的参数。
#
# BC 结构说明:
#   B 轴 — 绕 Y 轴旋转（笔的俯仰倾斜角）
#   C 轴 — 绕 Z 轴旋转（笔的方向旋转，控制长方形笔头线宽）
#   tool_length — B 轴旋转中心到笔尖的距离 (mm)
# ============================================================

# ============================================================
# MCU 主板
# ============================================================
[mcu]
# <<< 修改为你的主板串口 >>>
#   USB 连接:  ls /dev/serial/by-id/*  查看串口 ID
#   GPIO 连接:  /dev/ttyAMA0 等
serial: /dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0
# <<< 如果是 USB 连接，建议 baud: 250000 >>>
baud: 250000

# ============================================================
# 打印机基本参数
# ============================================================
[printer]
kinematics: cartesian_rtcp
max_velocity: 50
max_accel: 500
# Z 轴单独限速（可选，确保垂直方向安全）
max_z_velocity: 25
max_z_accel: 100

# === RTCP 参数 ===
# <<< 修改: B 轴旋转中心到笔尖的距离 (mm)，需实测 >>>
tool_length: 80
# 旋转轴配置: bc = B绕Y俯仰 + C绕Z旋转
rotary_config: bc

# ============================================================
# X 轴（左右）
# ============================================================
[stepper_x]
# <<< 修改为实际 pin >>>
step_pin: ar54
dir_pin: ar55
enable_pin: !ar38
# <<< 修改微步数和丝杆导程 >>>
microsteps: 16
rotation_distance: 40
# <<< 修改为实际 endstop pin 和类型 >>>
#   ^ = 常开 (NO)，! = 常闭 (NC)
endstop_pin: ^ar3
# <<< 修改: endstop 位置的坐标值 >>>
position_endstop: 0
# <<< 修改: 最大行程 >>>
position_max: 300
# <<< 修改: 归零速度 >>>
homing_speed: 30
# 第二归零速度（触发电平后慢速回退）
homing_retract_dist: 5
second_homing_speed: 5

# ============================================================
# Y 轴（前后）
# ============================================================
[stepper_y]
# <<< 修改为实际 pin >>>
step_pin: ar60
dir_pin: ar61
enable_pin: !ar56
microsteps: 16
rotation_distance: 40
endstop_pin: ^ar14
position_endstop: 0
position_max: 300
homing_speed: 30
homing_retract_dist: 5
second_homing_speed: 5

# ============================================================
# Z 轴（上下）
# ============================================================
[stepper_z]
# <<< 修改为实际 pin >>>
step_pin: ar46
dir_pin: ar48
enable_pin: !ar62
microsteps: 16
rotation_distance: 8
# Z 轴 endstop 一般在最低点 (position_endstop: 0)
# 归零后笔尖在最高 (安全) 位置
endstop_pin: ^ar18
# <<< 修改: Z 轴最低点的坐标（通常 0）>>>
position_endstop: 0
# <<< 修改: Z 轴最大高度 >>>
position_max: 200
homing_speed: 10
homing_retract_dist: 3
second_homing_speed: 3

# ============================================================
# B 轴（绕 Y 俯仰 — 笔的倾斜角度）
# ============================================================
[stepper_b]
# <<< 修改为实际 pin >>>
step_pin: ar26
dir_pin: ar28
enable_pin: !ar24
microsteps: 16
# 旋转轴：电机一圈 = 360 度
rotation_distance: 360
full_steps_per_rotation: 200
endstop_pin: ^ar40
# <<< 修改: 归零位置对应的角度（通常 0 = 笔竖直）>>>
position_endstop: 0
# <<< 修改: 角度范围，建议 0~90 起步 >>>
position_min: -90
position_max: 90
homing_speed: 20
homing_retract_dist: 10
second_homing_speed: 5

# ============================================================
# C 轴（绕 Z 旋转 — 笔的方向）
# ============================================================
[stepper_c]
# <<< 修改为实际 pin >>>
step_pin: ar36
dir_pin: ar34
enable_pin: !ar30
microsteps: 16
# 旋转轴：电机一圈 = 360 度
rotation_distance: 360
full_steps_per_rotation: 200
endstop_pin: ^ar41
# <<< 修改: 归零位置对应的角度 >>>
position_endstop: 0
# C 轴通常是 0~360 连续旋转
position_max: 360
homing_speed: 20
homing_retract_dist: 10
second_homing_speed: 5

# ============================================================
# 虚拟 SD 卡（上传 G-code 文件打印）
# ============================================================
[virtual_sdcard]
path: ~/gcode_files

# ============================================================
# 暂停/恢复
# ============================================================
[pause_resume]

# ============================================================
# 消息反馈
# ============================================================
[respond]

# ============================================================
# 手动控制（SET_KINEMATIC_POSITION 等）
# ============================================================
[force_move]
enable_force_move: True

# ============================================================
# 安全宏
# ============================================================

# --- 紧急停止后恢复 ---
[gcode_macro M999]
gcode:
    FIRMWARE_RESTART

# --- 电机解锁 ---
[gcode_macro M18]
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_b ENABLE=0
    SET_STEPPER_ENABLE STEPPER=stepper_c ENABLE=0

# --- 电机锁定 ---
[gcode_macro M17]
gcode:
    SET_STEPPER_ENABLE STEPPER=stepper_x ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_y ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_z ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_b ENABLE=1
    SET_STEPPER_ENABLE STEPPER=stepper_c ENABLE=1

# --- 所有轴归零 ---
[gcode_macro HOME_ALL]
gcode:
    G28 X Y Z B C

# --- 抬笔到安全高度 ---
[gcode_macro LIFT]
gcode:
    G91
    G1 Z30 F600
    G90

# ============================================================
# 用户自定义区（可添加更多宏）
# ============================================================

# --- 归零后移动到工作起始位置 ---
[gcode_macro START_POSITION]
gcode:
    G90
    # <<< 修改为你的工作起始位置 >>>
    G1 X150 Y150 Z100 B0 C0 F3000
