# Test config for xpainter_calibration module
# Uses virtual steppers via linuxprocess

[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesian_rtcp
max_velocity: 50
max_accel: 500
max_z_velocity: 25
max_z_accel: 100
tool_length: 50.0
rotary_config: bc
pivot_x: 0
pivot_y: 0
pivot_z: 0

[xpainter_zoffset]
z_offset: 0.0

# Virtual GPIO steppers for test
[stepper_x]
step_pin: gpiochip0/gpio0
dir_pin: gpiochip0/gpio1
enable_pin: gpiochip0/gpio2
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpiochip0/gpio3
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: gpiochip0/gpio4
dir_pin: gpiochip0/gpio5
enable_pin: gpiochip0/gpio6
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpiochip0/gpio7
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: gpiochip0/gpio8
dir_pin: gpiochip0/gpio9
enable_pin: gpiochip0/gpio10
microsteps: 16
rotation_distance: 8
endstop_pin: ^gpiochip0/gpio11
position_endstop: 0.5
position_max: 200
homing_speed: 20

[stepper_b]
step_pin: gpiochip0/gpio12
dir_pin: gpiochip0/gpio13
enable_pin: gpiochip0/gpio14
microsteps: 16
rotation_distance: 360
full_steps_per_rotation: 200
endstop_pin: ^gpiochip0/gpio40
position_endstop: 0
position_min: -45
position_max: 45
homing_speed: 50
homing_positive_dir: false

[stepper_c]
step_pin: gpiochip0/gpio16
dir_pin: gpiochip0/gpio17
enable_pin: gpiochip0/gpio18
microsteps: 16
rotation_distance: 360
full_steps_per_rotation: 200
endstop_pin: ^gpiochip0/gpio41
position_endstop: 0
position_min: -45
position_max: 45
homing_speed: 50
homing_positive_dir: false

[extruder]
step_pin: gpiochip0/gpio24
dir_pin: gpiochip0/gpio25
enable_pin: gpiochip0/gpio26
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
heater_pin: gpiochip0/gpio30
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpiochip0/gpio31
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 210

[heater_bed]
heater_pin: gpiochip0/gpio32
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpiochip0/gpio33
control: watermark
min_temp: 0
max_temp: 110

[fan]
pin: gpiochip0/gpio34

[force_move]
enable_force_move: True

# Minimal PEN_DOWN/PEN_UP for test (Z is virtual, safe)
[gcode_macro PEN_DOWN]
gcode:
    G91
    G1 Z-2 F200
    G90

[gcode_macro PEN_UP]
gcode:
    G91
    G1 Z2 F200
    G90
