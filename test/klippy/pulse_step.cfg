# Minimal config for pulse step counting test
# Uses Linux MCU for testing

[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesian
max_velocity: 50
max_accel: 1000

[stepper_x]
step_pin: gpiochip0/gpio0
dir_pin: gpiochip0/gpio1
enable_pin: gpiochip0/gpio2
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpiochip0/gpio3
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: gpiochip0/gpio4
dir_pin: gpiochip0/gpio5
enable_pin: gpiochip0/gpio6
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpiochip0/gpio7
position_endstop: 0
position_max: 200

[stepper_z]
step_pin: gpiochip0/gpio8
dir_pin: gpiochip0/gpio9
enable_pin: gpiochip0/gpio10
microsteps: 16
rotation_distance: 8
endstop_pin: ^gpiochip0/gpio11
position_endstop: 0
position_max: 200

[extruder]
step_pin: gpiochip0/gpio12
dir_pin: gpiochip0/gpio13
enable_pin: gpiochip0/gpio14
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
heater_pin: gpiochip0/gpio20
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpiochip0/gpio21
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 210

[heater_bed]
heater_pin: gpiochip0/gpio22
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpiochip0/gpio23
control: watermark
min_temp: 0
max_temp: 110

[fan]
pin: gpiochip0/gpio24