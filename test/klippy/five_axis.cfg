# Five-axis configuration (XYZABC)
# Uses cartesian_abc kinematics for multi-axis support

[mcu]
serial: /tmp/klipper_host_mcu

[printer]
kinematics: cartesian_abc
max_velocity: 50
max_accel: 1000
max_z_velocity: 25
max_z_accel: 30

# Linear axes
[stepper_x]
step_pin: gpiochip0/gpio0
dir_pin: gpiochip0/gpio1
enable_pin: gpiochip0/gpio2
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpiochip0/gpio3
position_endstop: 0
position_max: 200

[stepper_y]
step_pin: gpiochip0/gpio4
dir_pin: gpiochip0/gpio5
enable_pin: gpiochip0/gpio6
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpiochip0/gpio7
position_endstop: 0
position_max: 200

[stepper_z]
step_pin: gpiochip0/gpio8
dir_pin: gpiochip0/gpio9
enable_pin: gpiochip0/gpio10
microsteps: 16
rotation_distance: 8
endstop_pin: ^gpiochip0/gpio11
position_endstop: 0
position_max: 200

[stepper_a]
step_pin: gpiochip0/gpio12
dir_pin: gpiochip0/gpio13
enable_pin: gpiochip0/gpio14
microsteps: 16
rotation_distance: 360
full_steps_per_rotation: 200
endstop_pin: ^gpiochip0/gpio40
position_endstop: 0
position_max: 99999

[stepper_b]
step_pin: gpiochip0/gpio16
dir_pin: gpiochip0/gpio17
enable_pin: gpiochip0/gpio18
microsteps: 16
rotation_distance: 360
full_steps_per_rotation: 200
endstop_pin: ^gpiochip0/gpio41
position_endstop: 0
position_max: 99999

[stepper_c]
step_pin: gpiochip0/gpio20
dir_pin: gpiochip0/gpio21
enable_pin: gpiochip0/gpio22
microsteps: 16
rotation_distance: 360
full_steps_per_rotation: 200
endstop_pin: ^gpiochip0/gpio42
position_endstop: 0
position_max: 99999

# Extruder (E axis)
[extruder]
step_pin: gpiochip0/gpio24
dir_pin: gpiochip0/gpio25
enable_pin: gpiochip0/gpio26
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
heater_pin: gpiochip0/gpio30
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpiochip0/gpio31
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 210

[heater_bed]
heater_pin: gpiochip0/gpio32
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpiochip0/gpio33
control: watermark
min_temp: 0
max_temp: 110

[fan]
pin: gpiochip0/gpio34